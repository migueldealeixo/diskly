[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diskly"
version = "0.1.0.dev0"
description = "An offline storage analysis tool for Linux"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1,<2",
    "mypy>=1.13,<3",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "ruff>=0.8,<1",
]

[project.urls]
Repository = "https://github.com/migueldealeixo/diskly"
Issues = "https://github.com/migueldealeixo/diskly/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests", "benchmarks", "examples"]
strict = true
